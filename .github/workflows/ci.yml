name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: bank
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d bank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev,postgres]"

      - name: Load the sample database
        env:
          PGPASSWORD: postgres
        run: |
          for f in db/init/*.sql; do
            psql -h localhost -U postgres -d bank -v ON_ERROR_STOP=1 -q -f "$f"
          done

      - name: Lint
        run: |
          ruff check .
          ruff format --check .

      - name: Test
        env:
          TEST_DATABASE_URL: postgresql+psycopg://agent_reader:agent_reader@localhost:5432/bank
        run: pytest -q
