# Postgres with the sample data and a read-only role for the agent.
#   docker compose up -d
#   DATABASE_URL=postgresql+psycopg://agent_reader:agent_reader@localhost:5432/bank
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: bank
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bank"]
      interval: 5s
      timeout: 5s
      retries: 10
