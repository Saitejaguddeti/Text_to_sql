[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "text-to-sql-agent"
version = "0.1.0"
description = "LangGraph agent that answers plain-English questions over Postgres, Snowflake, or SQLite using read-only SQL."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Sai Teja Guddeti" }]
dependencies = [
    "langgraph>=1.0,<2",
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "sqlalchemy>=2.0,<3",
    "sqlglot>=30,<31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
snowflake = ["snowflake-sqlalchemy>=1.6"]
anthropic = ["langchain-anthropic>=1.0"]
openai = ["langchain-openai>=1.0"]
bedrock = ["langchain-aws>=1.0"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
text-to-sql = "text_to_sql.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
